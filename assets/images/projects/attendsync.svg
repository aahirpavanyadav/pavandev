<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="attBg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#0c0d11"/>
    </linearGradient>
    <pattern id="attGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="800" height="480" fill="url(#attBg)"/>
  <rect width="800" height="480" fill="url(#attGrid)"/>
  <rect width="800" height="480" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="44" fill="#111218" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="28" cy="22" r="5" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b" fill-opacity="0.7"/>
  <circle cx="64" cy="22" r="5" fill="#10b981" fill-opacity="0.7"/>
  <text x="96" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" fill="#71717a" letter-spacing="1">ATTENDSYNC // INSTITUTIONAL ATTENDANCE ENGINE</text>

  <!-- Status pill -->
  <rect x="670" y="12" width="105" height="20" rx="10" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
  <circle cx="682" cy="22" r="3" fill="#f59e0b"/>
  <text x="692" y="26" font-family="monospace" font-size="10.5" fill="#f59e0b" font-weight="600">IN PROGRESS</text>

  <!-- Left Overview Panel -->
  <rect x="24" y="64" width="220" height="392" rx="4" fill="#161720" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <text x="44" y="96" font-family="monospace" font-size="11" fill="#71717a" letter-spacing="1">SECTION STATUS</text>
  <text x="44" y="124" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f4f4f5">CSE AI/CSA-4B</text>

  <!-- Circular Metric Gauge -->
  <circle cx="134" cy="204" r="52" stroke="#22232c" stroke-width="8" fill="none"/>
  <circle cx="134" cy="204" r="52" stroke="#f59e0b" stroke-width="8" fill="none" stroke-dasharray="326" stroke-dashoffset="58" stroke-linecap="round"/>
  <text x="134" y="202" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5" text-anchor="middle">87.5%</text>
  <text x="134" y="222" font-family="monospace" font-size="10" fill="#a1a1aa" text-anchor="middle">AVERAGE</text>

  <!-- Stat Breakdown -->
  <g transform="translate(44, 280)">
    <rect x="0" y="0" width="180" height="42" rx="4" fill="#1b1c26" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="14" y="25" font-family="-apple-system, sans-serif" font-size="12" fill="#a1a1aa">Total Students</text>
    <text x="140" y="26" font-family="monospace" font-size="14" font-weight="700" fill="#f4f4f5">64</text>

    <rect x="0" y="52" width="180" height="42" rx="4" fill="#1b1c26" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="14" y="77" font-family="-apple-system, sans-serif" font-size="12" fill="#a1a1aa">Present Today</text>
    <text x="140" y="78" font-family="monospace" font-size="14" font-weight="700" fill="#10b981">56</text>

    <rect x="0" y="104" width="180" height="42" rx="4" fill="#1b1c26" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="14" y="129" font-family="-apple-system, sans-serif" font-size="12" fill="#a1a1aa">Threshold Risk (&lt;75%)</text>
    <text x="146" y="130" font-family="monospace" font-size="14" font-weight="700" fill="#ef4444">3</text>
  </g>

  <!-- Right Attendance Records Table -->
  <rect x="260" y="64" width="516" height="392" rx="4" fill="#14151c" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Filter & Actions Bar -->
  <g transform="translate(280, 84)">
    <rect x="0" y="0" width="160" height="32" rx="4" fill="#1b1c26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="21" font-family="monospace" font-size="11" fill="#a1a1aa">Filter: All Students</text>

    <rect x="174" y="0" width="140" height="32" rx="4" fill="#1b1c26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="190" y="21" font-family="monospace" font-size="11" fill="#a1a1aa">Date: Today</text>

    <rect x="376" y="0" width="100" height="32" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <text x="400" y="21" font-family="monospace" font-size="11" font-weight="600" fill="#f59e0b">Export CSV</text>
  </g>

  <!-- Student Grid Table -->
  <g transform="translate(280, 136)">
    <!-- Table Header -->
    <rect x="0" y="0" width="476" height="34" fill="#1a1b24" rx="4"/>
    <text x="16" y="22" font-family="monospace" font-size="11" fill="#71717a">ROLL NO</text>
    <text x="120" y="22" font-family="monospace" font-size="11" fill="#71717a">STUDENT NAME</text>
    <text x="280" y="22" font-family="monospace" font-size="11" fill="#71717a">AGGREGATE</text>
    <text x="390" y="22" font-family="monospace" font-size="11" fill="#71717a">STATUS</text>

    <!-- Row 1 -->
    <line x1="0" y1="34" x2="476" y2="34" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="62" font-family="monospace" font-size="12" fill="#a1a1aa">24-CSA-01</text>
    <text x="120" y="62" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Aditya Sharma</text>
    <text x="280" y="62" font-family="monospace" font-size="13" font-weight="600" fill="#10b981">94.2%</text>
    <rect x="390" y="48" width="70" height="20" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="402" y="62" font-family="monospace" font-size="10" fill="#10b981">PRESENT</text>

    <!-- Row 2 -->
    <line x1="0" y1="80" x2="476" y2="80" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="108" font-family="monospace" font-size="12" fill="#a1a1aa">24-CSA-02</text>
    <text x="120" y="108" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Kavya Reddy</text>
    <text x="280" y="108" font-family="monospace" font-size="13" font-weight="600" fill="#10b981">91.0%</text>
    <rect x="390" y="94" width="70" height="20" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="402" y="108" font-family="monospace" font-size="10" fill="#10b981">PRESENT</text>

    <!-- Row 3 -->
    <line x1="0" y1="126" x2="476" y2="126" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="154" font-family="monospace" font-size="12" fill="#a1a1aa">24-CSA-03</text>
    <text x="120" y="154" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Rohan Verma</text>
    <text x="280" y="154" font-family="monospace" font-size="13" font-weight="600" fill="#ef4444">71.5%</text>
    <rect x="390" y="140" width="70" height="20" rx="3" fill="rgba(239, 68, 68, 0.15)"/>
    <text x="406" y="154" font-family="monospace" font-size="10" fill="#ef4444">ABSENT</text>

    <!-- Row 4 -->
    <line x1="0" y1="172" x2="476" y2="172" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="200" font-family="monospace" font-size="12" fill="#a1a1aa">24-CSA-04</text>
    <text x="120" y="200" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Sneha Patel</text>
    <text x="280" y="200" font-family="monospace" font-size="13" font-weight="600" fill="#10b981">88.5%</text>
    <rect x="390" y="186" width="70" height="20" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="402" y="200" font-family="monospace" font-size="10" fill="#10b981">PRESENT</text>

    <!-- Row 5 -->
    <line x1="0" y1="218" x2="476" y2="218" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="246" font-family="monospace" font-size="12" fill="#a1a1aa">24-CSA-05</text>
    <text x="120" y="246" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Vikram Rao</text>
    <text x="280" y="246" font-family="monospace" font-size="13" font-weight="600" fill="#f59e0b">79.2%</text>
    <rect x="390" y="232" width="70" height="20" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="402" y="246" font-family="monospace" font-size="10" fill="#10b981">PRESENT</text>
  </g>
</svg>
