<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gymBg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="100%" stop-color="#0c0d11"/>
    </linearGradient>
    <pattern id="gymGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="800" height="480" fill="url(#gymBg)"/>
  <rect width="800" height="480" fill="url(#gymGrid)"/>
  <rect width="800" height="480" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="44" fill="#111218" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="28" cy="22" r="5" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b" fill-opacity="0.7"/>
  <circle cx="64" cy="22" r="5" fill="#10b981" fill-opacity="0.7"/>
  <text x="96" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" fill="#71717a" letter-spacing="1">GYMGO // WORKOUT LOG &amp; METRICS ENGINE</text>

  <!-- Status pill -->
  <rect x="670" y="12" width="105" height="20" rx="10" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
  <circle cx="682" cy="22" r="3" fill="#f59e0b"/>
  <text x="692" y="26" font-family="monospace" font-size="10.5" fill="#f59e0b" font-weight="600">IN PROGRESS</text>

  <!-- Left Sidebar Mockup -->
  <rect x="24" y="64" width="180" height="392" rx="4" fill="#161720" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <rect x="40" y="88" width="148" height="28" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
  <text x="52" y="106" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f59e0b">● Active Routine</text>

  <rect x="40" y="128" width="148" height="24" rx="4" fill="transparent"/>
  <text x="52" y="144" font-family="-apple-system, sans-serif" font-size="12" fill="#a1a1aa">Weekly Split</text>

  <rect x="40" y="160" width="148" height="24" rx="4" fill="transparent"/>
  <text x="52" y="176" font-family="-apple-system, sans-serif" font-size="12" fill="#a1a1aa">Volume Analytics</text>

  <rect x="40" y="192" width="148" height="24" rx="4" fill="transparent"/>
  <text x="52" y="208" font-family="-apple-system, sans-serif" font-size="12" fill="#a1a1aa">Personal Records</text>

  <line x1="40" y1="236" x2="188" y2="236" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="40" y="265" font-family="monospace" font-size="10" fill="#52525b" letter-spacing="1">WEEKLY VOLUME</text>
  <text x="40" y="295" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#f4f4f5">18,450 <tspan font-size="12" font-weight="400" fill="#a1a1aa">kg</tspan></text>
  <text x="40" y="320" font-family="monospace" font-size="11" fill="#10b981">+6.4% consistency</text>

  <!-- Main Content Area -->
  <rect x="220" y="64" width="556" height="392" rx="4" fill="#14151c" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Top Metrics Bar -->
  <g transform="translate(240, 84)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="158" height="74" rx="4" fill="#181922" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="14" y="22" font-family="monospace" font-size="10" fill="#71717a">TOTAL SESSIONS</text>
    <text x="14" y="52" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#f4f4f5">24</text>
    <text x="52" y="52" font-family="monospace" font-size="11" fill="#10b981">/ month</text>

    <!-- Metric 2 -->
    <rect x="174" y="0" width="158" height="74" rx="4" fill="#181922" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="188" y="22" font-family="monospace" font-size="10" fill="#71717a">AVG REST TIME</text>
    <text x="188" y="52" font-family="-apple-system, sans-serif" font-size="24" font-weight="700" fill="#f4f4f5">75<tspan font-size="13" font-weight="400" fill="#a1a1aa">s</tspan></text>

    <!-- Metric 3 -->
    <rect x="348" y="0" width="168" height="74" rx="4" fill="#181922" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="362" y="22" font-family="monospace" font-size="10" fill="#71717a">ACTIVE TARGET</text>
    <text x="362" y="52" font-family="-apple-system, sans-serif" font-size="18" font-weight="600" fill="#f59e0b">Hypertrophy B</text>
  </g>

  <!-- Workout Routine Log Table -->
  <g transform="translate(240, 180)">
    <rect x="0" y="0" width="516" height="252" rx="4" fill="#161720" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="516" height="36" fill="#1a1b24" rx="4"/>
    <text x="16" y="23" font-family="monospace" font-size="11" fill="#71717a">EXERCISE</text>
    <text x="210" y="23" font-family="monospace" font-size="11" fill="#71717a">SETS × REPS</text>
    <text x="340" y="23" font-family="monospace" font-size="11" fill="#71717a">LOAD (KG)</text>
    <text x="440" y="23" font-family="monospace" font-size="11" fill="#71717a">STATUS</text>

    <!-- Row 1 -->
    <line x1="0" y1="36" x2="516" y2="36" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Barbell Back Squat</text>
    <text x="210" y="66" font-family="monospace" font-size="13" fill="#a1a1aa">4 × 8</text>
    <text x="340" y="66" font-family="monospace" font-size="13" fill="#f59e0b" font-weight="600">100.0</text>
    <rect x="438" y="52" width="60" height="20" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="446" y="66" font-family="monospace" font-size="10" fill="#10b981">DONE</text>

    <!-- Row 2 -->
    <line x1="0" y1="88" x2="516" y2="88" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="118" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Romanian Deadlift</text>
    <text x="210" y="118" font-family="monospace" font-size="13" fill="#a1a1aa">3 × 10</text>
    <text x="340" y="118" font-family="monospace" font-size="13" fill="#f59e0b" font-weight="600">85.0</text>
    <rect x="438" y="104" width="60" height="20" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="446" y="118" font-family="monospace" font-size="10" fill="#10b981">DONE</text>

    <!-- Row 3 -->
    <line x1="0" y1="140" x2="516" y2="140" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="170" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5">Standing Calf Raises</text>
    <text x="210" y="170" font-family="monospace" font-size="13" fill="#a1a1aa">4 × 15</text>
    <text x="340" y="170" font-family="monospace" font-size="13" fill="#a1a1aa">60.0</text>
    <rect x="438" y="156" width="60" height="20" rx="3" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="444" y="170" font-family="monospace" font-size="10" fill="#f59e0b">ACTIVE</text>

    <!-- Row 4 -->
    <line x1="0" y1="192" x2="516" y2="192" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="222" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#71717a">Hanging Leg Raises</text>
    <text x="210" y="222" font-family="monospace" font-size="13" fill="#71717a">3 × 12</text>
    <text x="340" y="222" font-family="monospace" font-size="13" fill="#71717a">Bodyweight</text>
    <rect x="438" y="208" width="60" height="20" rx="3" fill="rgba(255, 255, 255, 0.05)"/>
    <text x="444" y="222" font-family="monospace" font-size="10" fill="#71717a">QUEUED</text>
  </g>
</svg>
