    <rect x="538" y="22" width="192" height="16" rx="2" fill="#242636"/>
    <circle cx="580" cy="80" r="28" stroke="#10b981" stroke-width="3" fill="none"/>
    <text x="580" y="84" font-family="monospace" font-size="12" fill="#10b981" text-anchor="middle">98%</text>
    <rect x="626" y="58" width="84" height="8" rx="2" fill="#2b2d3d"/>
    <rect x="626" y="74" width="60" height="8" rx="2" fill="#2b2d3d"/>
