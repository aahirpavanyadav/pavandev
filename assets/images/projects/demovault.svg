  <circle cx="28" cy="22" r="5" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b" fill-opacity="0.7"/>
  <circle cx="64" cy="22" r="5" fill="#10b981" fill-opacity="0.7"/>
  <text x="96" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" fill="#71717a" letter-spacing="1">DEMOVAULT // PROTOTYPE &amp; EXPERIMENT STAGING HUB</text>

  <!-- Status pill -->
  <rect x="682" y="12" width="94" height="20" rx="10" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
  <circle cx="694" cy="22" r="3" fill="#3b82f6"/>
  <text x="704" y="26" font-family="monospace" font-size="10.5" fill="#60a5fa" font-weight="600">PROTOTYPE</text>

