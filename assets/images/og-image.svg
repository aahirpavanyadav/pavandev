<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <pattern id="ogDotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.06)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogDotGrid)"/>
  <rect x="24" y="24" width="1152" height="582" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Top bar -->
  <text x="72" y="88" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16" fill="#f59e0b" letter-spacing="2">PAVANDEV.IN // OFFICIAL PORTFOLIO</text>
  <line x1="72" y1="110" x2="1128" y2="110" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Main identity -->
  <text x="72" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#f4f4f5" letter-spacing="-1.5">Aahir Pavan Yadav</text>
  
  <text x="72" y="278" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#a1a1aa">
    Software Developer <tspan fill="#f59e0b">|</tspan> Tech Lead <tspan fill="#f59e0b">|</tspan> Builder
  </text>

  <text x="72" y="360" font-family="-apple-system, sans-serif" font-size="32" font-weight="600" fill="#e4e4e7">
    Building digital products. Engineering real solutions.
  </text>

  <!-- Badges / Metadata -->
  <g transform="translate(72, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="280" height="48" rx="6" fill="#14151e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="29" font-family="-apple-system, sans-serif" font-size="15" fill="#a1a1aa">
      <tspan fill="#f59e0b">●</tspan> Tech Lead @ HackWithIndia
    </text>

    <!-- Badge 2 -->
    <rect x="300" y="0" width="260" height="48" rx="6" fill="#14151e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="29" font-family="-apple-system, sans-serif" font-size="15" fill="#a1a1aa">
      <tspan fill="#3b82f6">●</tspan> DevOps @ GDG MCET
    </text>

    <!-- Badge 3 -->
    <rect x="580" y="0" width="260" height="48" rx="6" fill="#14151e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="29" font-family="-apple-system, sans-serif" font-size="15" fill="#a1a1aa">
      <tspan fill="#10b981">●</tspan> B.Tech CSE (AI/CSA)
    </text>
  </g>

  <!-- Footer -->
  <line x1="72" y1="520" x2="1128" y2="520" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="72" y="560" font-family="'JetBrains Mono', monospace" font-size="15" fill="#71717a">HYDERABAD, INDIA</text>
  <text x="1128" y="560" font-family="'JetBrains Mono', monospace" font-size="15" fill="#71717a" text-anchor="end">HTTPS://PAVANDEV.IN</text>
